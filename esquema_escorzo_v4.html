
<style>
  .vp4 { display: none; }
  .vp4.active { display: block; }
  .pp4 { display: none; }
  .pp4.active { display: block; }
  .tbar4 {
    display: flex;
    border: 1.5px solid #FCC839;
    border-radius: 8px;
    overflow: hidden;
    width: fit-content;
    margin: 6px auto 4px;
  }
  .tbar4 button {
    padding: 9px 22px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    transition: background 0.2s, color 0.2s;
  }
  .tbar4 button.sel { background: #FCC839; color: #0B0C0F; }
  .tbar4 button:not(.sel):hover { background: rgba(252,200,57,0.1); }
  .pbar4 {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 6px 12px 0;
  }
  .pbar4 button {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border: 1px solid var(--color-border-secondary);
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .pbar4 button.sel { background: #14B4EB; color: #fff; border-color: #14B4EB; }
  .pbar4 button:not(.sel):hover { background: var(--color-background-secondary); }
</style>
