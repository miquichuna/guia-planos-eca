
<style>
  @keyframes pan-sweep-pf {
    0%   { transform: rotate(-38deg); }
    100% { transform: rotate(32deg); }
  }
  @keyframes arc-draw-pf {
    0%   { stroke-dashoffset: 200; opacity: 0.15; }
    100% { stroke-dashoffset: 0;   opacity: 1; }
  }
  @keyframes arrow-end-pf {
    0%,80% { opacity: 0; }
    100%   { opacity: 1; }
  }
  .cam-pivot-pf { transform-origin: 310px 286px; }
  .cam-pivot-pf.go { animation: pan-sweep-pf 2.8s ease-in-out forwards; }
  .arc-path-pf { stroke-dasharray: 200; stroke-dashoffset: 200; }
  .arc-path-pf.go { animation: arc-draw-pf 2.8s ease-in-out forwards; }
  .v-end-pf { opacity: 0; }
  .v-end-pf.go { animation: arrow-end-pf 2.8s ease-in-out forwards; }
  .lbl-arc-pf { opacity: 0; transition: opacity 0.5s; }

  .vista-panel-pf { display: none; }
  .vista-panel-pf.active { display: block; }

  .toggle-bar-pf {
    display: flex;
    border: 1.5px solid #FCC839;
    border-radius: 8px;
    overflow: hidden;
    width: fit-content;
    margin: 6px auto 4px;
  }
  .toggle-bar-pf button {
    padding: 9px 22px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    transition: background 0.2s, color 0.2s;
  }
  .toggle-bar-pf button.sel { background: #FCC839; color: #0B0C0F; }
  .toggle-bar-pf button:not(.sel):hover { background: rgba(252,200,57,0.1); }

  #btn-play-pf {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px auto 0;
    padding: 9px 22px;
    border: 1.5px solid #FCC839;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-primary);
    transition: background 0.2s;
  }
  #btn-play-pf:hover { background: rgba(252,200,57,0.12); }
  #btn-play-pf:active { transform: scale(0.97); }

  #subtitulo-vista {
    font-size: 12px;
    color: var(--color-text-secondary);
    text-align: center;
    margin: 2px 0 0;
    opacity: 0.8;
  }
</style>

<h2 class="sr-only">Esquema del paneo en dos vistas: desde arriba y de frente.</h2>

<!-- TÍTULO PRINCIPAL -->
<p style="text-align:center; font-size:18px; font-weight:500; margin: 0 0 2px; color:var(--color-text-primary);">Paneo</p>
<p id="subtitulo-vista" >Pasillo · vista desde arriba</p>

<!-- BOTONES -->
<div class="toggle-bar-pf">
  <button id="btn-top-pf" class="sel" onclick="showVistaPF('top')">
    <i class="ti ti-eye" aria-hidden="true" style="font-size:14px; margin-right:5px;"></i>Vista desde arriba
  </button>
  <button id="btn-front-pf" onclick="showVistaPF('front')">
    <i class="ti ti-camera" aria-hidden="true" style="font-size:14px; margin-right:5px;"></i>Vista de frente
  </button>
</div>

<!-- ══ VISTA CENITAL ══ -->

  <rect x="60" y="43" width="560" height="312" fill="var(--color-background-secondary)" opacity="0.55"/>
  <line x1="60" y1="199" x2="620" y2="199" stroke="var(--color-border-tertiary)" stroke-width="1" stroke-dasharray="10 6"/>

  <text x="76" y="383" style="font-size:11px; fill:var(--color-text-secondary); opacity:0.55;">pared</text>

  <path d="M 88 43 Q 88 94 138 43"

  <text x="113" y="110" text-anchor="middle" style="font-size:12px; font-weight:500; fill:#185FA5;">puerta</text>

  <ellipse cx="508" cy="207" rx="11" ry="7" fill="#FCC839" fill-opacity="0.35" stroke="#FCC839" stroke-width="1.5"/>

    <rect x="284" y="252" width="52" height="34" rx="6"

    <polygon points="299,252 321,252 317,232 303,232"

    <circle cx="310" cy="264" r="4"

  </g>
  <text x="310" y="302" text-anchor="middle" style="font-size:12px; font-weight:500; fill:#185FA5;">cámara</text>
  <text x="310" y="316" text-anchor="middle" style="font-size:11px; fill:#185FA5; opacity:0.8;">(no se mueve de sitio)</text>

  <line id="v-start-pf" x1="310" y1="232" x2="132" y2="133"

<div style="text-align:center;">
  <button id="btn-play-pf" onclick="playPF()">

</div>
</div>

<!-- ══ VISTA FRONTAL ══ -->
<div id="panel-front-pf" class="vista-panel-pf">
<svg width="100%" viewBox="0 0 680 430" role="img">
  <title>Paneo — vista de frente</title>
  <desc>Vista frontal. Cámara sobre trípode en primer plano vista por detrás, puerta al fondo izquierda, Matías de pie al fondo derecha.</desc>
  <defs>
    <marker id="aFp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">

  </defs>

  <rect x="40" y="40" width="600" height="290" fill="var(--color-background-secondary)" opacity="0.28"/>
  <rect x="40" y="330" width="600" height="70" rx="4" fill="var(--color-background-secondary)" opacity="0.55"/>
  <line x1="40" y1="330" x2="640" y2="330" stroke="var(--color-text-secondary)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.28"/>

  <line x1="340" y1="130" x2="640" y2="330" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="6 4"/>

  <rect x="94" y="171" width="66" height="118" rx="2"

  <circle cx="152" cy="235" r="4" fill="#14B4EB" fill-opacity="0.6" stroke="#14B4EB" stroke-width="1"/>
  <text x="127" y="312" text-anchor="middle" style="font-size:12px; font-weight:500; fill:#185FA5;">puerta</text>
  <text x="127" y="326" text-anchor="middle" style="font-size:11px; fill:#185FA5; opacity:0.8;">(punto de partida)</text>

  <!-- MATÍAS derecha -->
  <line x1="513" y1="285" x2="505" y2="325" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
  <line x1="527" y1="285" x2="535" y2="325" stroke="#BA7517" stroke-width="3" stroke-linecap="round"/>
  <rect x="503" y="230" width="34" height="58" rx="8"

  <circle cx="520" cy="212" r="18"

  <line x1="503" y1="248" x2="482" y2="272" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="537" y1="248" x2="558" y2="272" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <text x="520" y="348" text-anchor="middle" style="font-size:12px; font-weight:500; fill:#BA7517;">Matías</text>
  <text x="520" y="362" text-anchor="middle" style="font-size:11px; fill:#BA7517; opacity:0.8;">(al fondo, derecha)</text>

  <!-- TRÍPODE -->
  <line x1="300" y1="300" x2="258" y2="380" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="380" y1="300" x2="422" y2="380" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <line x1="340" y1="300" x2="340" y2="385" stroke="var(--color-text-secondary)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- Etiqueta cámara -->

  <text x="340" y="222" text-anchor="middle"

        marker-end="url(#aFp)"/>

  <!-- Nota inferior -->
  <text x="340" y="412" text-anchor="middle"
        style="font-size:11px; fill:var(--color-text-secondary); opacity:0.65;">vosotros estáis aquí, detrás de la cámara</text>
</svg>
</div>

<script>
  var playedPF = false;

  function showVistaPF(v) {
    document.getElementById('panel-top-pf').classList.toggle('active', v === 'top');
    document.getElementById('panel-front-pf').classList.toggle('active', v === 'front');
    document.getElementById('btn-top-pf').classList.toggle('sel', v === 'top');
    document.getElementById('btn-front-pf').classList.toggle('sel', v === 'front');
    document.getElementById('subtitulo-vista').textContent =
      v === 'top' ? 'Pasillo · vista desde arriba' : 'Pasillo · vista de frente';
  }

  function playPF() {
    var btn  = document.getElementById('btn-play-pf');
    var cam  = document.getElementById('cam-pf');
    var arc  = document.getElementById('arc-pf');
    var vend = document.getElementById('v-end-pf');
    var lbl  = document.getElementById('lbl-arc-pf');
    var vst  = document.getElementById('v-start-pf');

    if (playedPF) {
      cam.classList.remove('go');
      arc.classList.remove('go');
      vend.classList.remove('go');
      void cam.offsetWidth;
      arc.style.strokeDashoffset = '200';
      arc.style.opacity = '';
      vend.style.opacity = '0';
      lbl.style.opacity = '0';
      vst.style.opacity = '0.65';
      btn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true" style="font-size:15px; color:#FCC839;"></i> Ver el paneo';
      playedPF = false;
      return;
    }

    playedPF = true;
    btn.innerHTML = '<i class="ti ti-refresh" aria-hidden="true" style="font-size:15px; color:#FCC839;"></i> Repetir';

    setTimeout(function() {
      vst.style.opacity = '0.08';
      cam.classList.add('go');
      arc.classList.add('go');
      vend.classList.add('go');
    }, 900);

    setTimeout(function() { lbl.style.opacity = '1'; }, 3000);
  }
</script>
